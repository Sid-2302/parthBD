<!DOCTYPE html>
<html lang="en">
` Yoo! Looking for code, hua? 🖕  `
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Parth</title>
<style>
  :root {
    --bg-dark: #16161e;
    --bg-light: #2c2c3a;
    --cake-left: #2a1610;
    --cake-mid: #4a291e;
    --cake-right: #361c14;
    --filling: #d46b7e;
    --icing-main: #fffaee;
    --icing-shadow: #e6dfcf;
    --plate: #404050;
  }

  body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at center, var(--bg-light) 0%, var(--bg-dark) 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* --- LOADER SCREEN --- */
  #loader-screen {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    transition: opacity 0.5s ease;
  }

  .countdown {
    font-size: 5rem;
    color: white;
    font-weight: 300;
    will-change: transform, opacity;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* --- MAIN CONTENT (Hidden initially) --- */
  #main-content {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  #main-content.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* Double border frame */
  .frame-outer {
    border: 1px solid rgba(255, 255, 255, 0.15);
    width: 90vw;
    max-width: 800px;
    height: 85vh;
    max-height: 600px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    box-sizing: border-box;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
    z-index: 10;
  }

  .frame-inner {
    border: 1px solid rgba(255, 255, 255, 0.1);
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    padding-top: 10%; 
  }

  .cake-scene {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 240px;
  }

  /* Base Plate */
  .plate-container {
    position: relative;
    width: 220px;
    height: 12px;
    margin-top: 2px;
    opacity: 0;
    will-change: opacity, transform;
  }
  .visible .plate-container { animation: smoothFadeIn 0.8s ease forwards 0.2s; }

  .plate {
    width: 100%;
    height: 10px;
    background: var(--plate);
    border-radius: 50%;
    box-shadow: 0 15px 15px rgba(0, 0, 0, 0.5);
  }

  /* Cake Layers */
  .layer {
    height: 32px;
    background: linear-gradient(90deg, var(--cake-left) 0%, var(--cake-mid) 40%, var(--cake-mid) 60%, var(--cake-right) 100%);
    border-radius: 3px;
    opacity: 0;
    position: relative;
    z-index: 2;
    will-change: transform, opacity;
  }

  .layer::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 100%;
    height: 4px;
    background: var(--filling);
    border-radius: 2px;
    z-index: 3;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .layer-1::after { display: none; } 

  .layer-1 { width: 190px; }
  .layer-2 { width: 190px; margin-bottom: 4px; }
  .layer-3 { width: 190px; margin-bottom: 4px; }

  .visible .layer-1 { animation: bounceDrop 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards 0.5s; }
  .visible .layer-2 { animation: bounceDrop 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards 0.8s; }
  .visible .layer-3 { animation: bounceDrop 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards 1.1s; }

  /* Main Icing Block */
  .icing {
    width: 196px;
    height: 22px;
    background: var(--icing-main);
    border-radius: 12px 12px 4px 4px;
    position: relative;
    z-index: 4;
    opacity: 0;
    will-change: transform, opacity;
    box-shadow: inset 0 3px 0 #ffffff, 0 4px 5px rgba(0, 0, 0, 0.15);
  }
  .visible .icing { animation: bounceDrop 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards 1.5s; }

  /* Dynamic Liquid Drips */
  .drip {
    position: absolute;
    top: 15px; 
    background: var(--icing-main);
    border-radius: 0 0 20px 20px; 
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.05), 2px 4px 4px rgba(0, 0, 0, 0.1);
    height: 0; 
    will-change: height;
  }

  .drip:nth-child(1) { --final-height: 28px; width: 16px; left: 8px; }
  .drip:nth-child(2) { --final-height: 50px; width: 22px; left: 34px; }
  .drip:nth-child(3) { --final-height: 22px; width: 14px; left: 70px; }
  .drip:nth-child(4) { --final-height: 45px; width: 24px; right: 45px; }
  .drip:nth-child(5) { --final-height: 35px; width: 18px; right: 12px; }

  .visible .drip:nth-child(1) { animation: stretchDrip 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.1s; }
  .visible .drip:nth-child(2) { animation: stretchDrip 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.4s; }
  .visible .drip:nth-child(3) { animation: stretchDrip 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.2s; }
  .visible .drip:nth-child(4) { animation: stretchDrip 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.5s; }
  .visible .drip:nth-child(5) { animation: stretchDrip 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.3s; }

  /* Candle */
  .candle-container {
    position: relative;
    width: 10px;
    height: 45px;
    opacity: 0;
    z-index: 1;
    margin-bottom: -8px; 
    will-change: transform, opacity;
  }
  .visible .candle-container { animation: smoothSlideUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards 2.7s; }

  .candle {
    width: 10px;
    height: 35px;
    background: repeating-linear-gradient(-45deg, #ffffff, #ffffff 4px, #f4a5b3 4px, #f4a5b3 8px);
    border-radius: 3px;
    position: absolute;
    bottom: 0;
    box-shadow: inset -2px 0 3px rgba(0,0,0,0.1);
  }

  .flame {
    width: 14px;
    height: 22px;
    background: radial-gradient(ellipse at bottom, #ffffff 10%, #ffeb3b 40%, #ff9800 80%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: absolute;
    top: -24px;
    left: -2px;
    opacity: 0;
    will-change: opacity, transform, filter;
  }
  .visible .flame { animation: smoothFadeIn 0.8s ease forwards 3.1s, flicker 0.12s infinite alternate 3.9s; }

  /* Typography */
  .text-container {
    text-align: center;
    color: #fff;
    margin-top: 45px;
    opacity: 0;
    will-change: transform, opacity;
  }
  .visible .text-container { animation: textSlideUp 1.2s cubic-bezier(0.165, 0.84, 0.44, 1) forwards 3.6s; }

  .text-container h1 {
    margin: 0;
    font-size: 1.8rem;
    font-weight: 300;
    font-style: italic;
    letter-spacing: 0.5px;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
  }

  .text-container p {
    margin: 6px 0 0 0;
    font-size: 1.6rem;
    font-style: italic;
    font-family: 'Georgia', serif;
    color: #a4a4b5;
  }

  /* --- BALLOONS --- */
  #balloons-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 20;
    overflow: hidden;
  }

  .balloon {
    position: absolute;
    top: 0;
    left: 0;
    width: 70px;
    height: 90px;
    background-color: #ffffff;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.1);
    background-size: cover;
    background-position: center;
    will-change: transform;
  }

  /* The string of the balloon */
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 30px;
    background-color: rgba(255, 255, 255, 0.4);
  }

  /* ----------------------
     KEYFRAMES 
     ---------------------- */
  @keyframes bounceDrop {
    0% { transform: translateY(-70px); opacity: 0; }
    50% { opacity: 1; }
    70% { transform: translateY(4px); opacity: 1; } 
    85% { transform: translateY(-1px); opacity: 1; } 
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes stretchDrip { 0% { height: 0; } 100% { height: var(--final-height); } }
  @keyframes textSlideUp { 0% { transform: translateY(20px); opacity: 0; filter: blur(4px); } 100% { transform: translateY(0); opacity: 1; filter: blur(0); } }
  @keyframes smoothSlideUp { 0% { transform: translateY(15px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes smoothFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes flicker { 0% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 10px rgba(255, 152, 0, 0.6)); } 100% { transform: scale(1.05) rotate(1deg); filter: drop-shadow(0 0 18px rgba(255, 235, 59, 0.9)); } }

  @media (max-width: 480px) {
    .frame-outer { width: 92vw; height: 90vh; padding: 8px; }
    .cake-scene { transform: scale(0.85); }
    .text-container h1 { font-size: 1.4rem; }
    .balloon { width: 45px; height: 65px; } /* Smaller balloons for mobile */
  }
</style>
</head>
<body>

  <div id="loader-screen">
    <div class="countdown" id="countdown-num">3</div>
  </div>

  <div id="main-content">
    <div class="frame-outer">
      <div class="frame-inner">
        <div class="cake-scene">
          <div class="candle-container">
            <div class="flame"></div>
            <div class="candle"></div>
          </div>
          <div class="icing">
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
          </div>
          <div class="layer layer-3"></div>
          <div class="layer layer-2"></div>
          <div class="layer layer-1"></div>
          <div class="plate-container">
            <div class="plate"></div>
          </div>
        </div>
        <div class="text-container">
          <h1>happy birthday!</h1>
          <p>Parth</p>
        </div>
      </div>
    </div>
  </div>

  <div id="balloons-container"></div>

  <script>
    
    const birthdayBoyImageURL = "pic.jpeg"; 

    // Logic Elements
    const loaderNum = document.getElementById('countdown-num');
    const loaderScreen = document.getElementById('loader-screen');
    const mainContent = document.getElementById('main-content');
    const balloonsContainer = document.getElementById('balloons-container');

    // Start Countdown
    let count = 3;
    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        loaderNum.innerText = count;
      } else {
        clearInterval(interval);
        
        // Hide loader and start cake animation
        loaderScreen.style.opacity = "0";
        setTimeout(() => {
          loaderScreen.style.display = "none";
          mainContent.classList.add("visible");
        }, 500);

        // Trigger balloons just as the cake finishes its animation
        setTimeout(createBalloons, 5500);
      }
    }, 1000);

    // Create Balloon Blast & Floating Logic
    function createBalloons() {
      const balloonCount = 20; 

      for (let i = 0; i < balloonCount; i++) {
        const balloon = document.createElement('div');
        balloon.classList.add('balloon');

        if (birthdayBoyImageURL !== "IMAGE") {
          balloon.style.backgroundImage = `url('${birthdayBoyImageURL}')`;
        }

        // 1. Position balloons just below the screen
        let currentX = Math.random() * window.innerWidth;
        let currentY = window.innerHeight + 150; 
        let currentRot = (Math.random() - 0.5) * 30; // Random tilt
        
        balloon.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentRot}deg)`;
        balloonsContainer.appendChild(balloon);

        // Force a browser reflow so the initial position is registered
        balloon.getBoundingClientRect();

        // Stagger when each balloon launches
        let launchDelay = Math.random() * 5000;
        
        setTimeout(() => {
          // 2. Initial Rise: Float up to a random spot on the screen
          let targetX = currentX + (Math.random() - 0.5) * 200; // Drift left or right slightly
          let targetY = Math.random() * (window.innerHeight * 0.75); // Target upper 75% of screen
          let targetRot = (Math.random() - 0.5) * 40;
          
          let riseDuration = 4 + Math.random() * 3; // Takes 4 to 6 seconds to rise
          
          balloon.style.transition = `transform ${riseDuration}s cubic-bezier(0.25, 1, 0.5, 1)`;
          balloon.style.transform = `translate(${targetX}px, ${targetY}px) rotate(${targetRot}deg)`;

          // 3. Continuous Floating: When the rise finishes, start drifting randomly forever
          balloon.addEventListener('transitionend', function driftRandomly(e) {
            // Ensure we are only reacting to the transform transition
            if (e.propertyName !== 'transform') return;

            // Pick a new random point near its current position to drift towards
            targetX = Math.max(-50, Math.min(window.innerWidth, targetX + (Math.random() - 0.5) * 400));
            targetY = Math.max(-50, Math.min(window.innerHeight, targetY + (Math.random() - 0.5) * 400));
            targetRot = (Math.random() - 0.5) * 50;

            let floatDuration = 4 + Math.random() * 5; // Slow, lazy drift (4 to 9 seconds)
            
            balloon.style.transition = `transform ${floatDuration}s ease-in-out`;
            balloon.style.transform = `translate(${targetX}px, ${targetY}px) rotate(${targetRot}deg)`;
          });
        }, launchDelay);
      }
    }
  </script>
</body>
</html>
